# AEGIS NIDS System Configuration v4.0
[bridge]
pipe_name = \\.\pipe\aegis_bridge
event_queue_capacity = 8192

[core]
brain_udp_port = 9999
brain_udp_host = 127.0.0.1

[brain]
listen_port = 9999
rules_file = config/Rules.json
hot_reload = true

[nose]
refresh_interval_s = 2
ipc_file_path = logs/bridge_status.json

[mouth]
refresh_interval_ms = 1000
log_file = logs/anomalous.json
ipc_file_path = logs/bridge_events.json

[ips]
enabled = true
method = netsh
