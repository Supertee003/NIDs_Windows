[package]
name = "aegis_dashboard"
version = "0.1.0"
edition = "2021"
description = "AEGIS NIDS Security Dashboard — Pure Rust egui GUI"
authors = ["AEGIS NIDS"]

[[bin]]
name = "aegis_dashboard"
path = "src/main.rs"

[dependencies]
egui = "0.29"
eframe = "0.29"
egui_extras = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
# When Bridge DLL is available at runtime
bridge_ffi = []
