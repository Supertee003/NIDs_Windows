[package]
name = "aegis_dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# GAP-5: Removed unused deps (axum, tokio, dashmap, tracing, rusqlite, uuid, etc.)
# after deleting orphan source files (bridge_ffi.rs, data.rs, db.rs, rules.rs, udp.rs, handlers/)

[profile.release]
opt-level = 3
lto = true
