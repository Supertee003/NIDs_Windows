# I01 - Cargo manifest for Rust PEP (Policy Enforcement Point) and Federation TLS
[package]
name = "aegis_pep"
version = "5.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["AEGIS Team"]
description = "Policy Enforcement Point and Federation TLS for AEGIS NIDS"
license = "MIT"

[lib]
name = "aegis_pep"
crate-type = ["cdylib", "rlib"]
path = "rust-src/lib.rs"

[dependencies]
# Cryptography & TLS
ring = "0.17"
rand = "0.8"
rustls = "0.23"
rustls-pemfile = "2.1"
x509-parser = "0.16"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
# Concurrency
parking_lot = "0.12"
crossbeam-channel = "0.5"
# Logging
log = "0.4"
env_logger = "0.11"
# Windows APIs
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
