# ============================================================
# AEGIS NIDS - G25: Host Regression (Phase T + Phase K)
# ============================================================
# Runs the full logic-layer regression on Linux Host.
# This complements the Windows-target CI in ci.yml by validating
# that every Zig source file compiles standalone on Host AND that
# the Python runtime contract tests pass.
#
# Triggered on every push and pull request.
# ============================================================
name: Host Regression (Phase T+K)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================
  # Phase T: Python runtime contract tests (9 files in tests/runtime/)
  # ============================================================
  phase-t-runtime-contract:
    name: Phase T - Runtime Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Text encoding guard (UTF-8, no BOM, LF in Zig sources)
        run: |
          # Step 2 guard: core/ was once stored as UTF-16LE, which made it
          # invisible to grep/AI analysis, uncompilable by Zig, and unreadable
          # by the contract tests. Fail fast if any UTF-16/BOM file or CRLF
          # Zig source re-enters the repository.
          bad=0
          while IFS= read -r f; do
            b=$(head -c 2 "$f" | od -An -tx1 | tr -d ' \n')
            if [ "$b" = "fffe" ] || [ "$b" = "feff" ]; then
              echo "::error file=$f::UTF-16 BOM detected - convert to UTF-8 (no BOM)"
              bad=$((bad + 1))
            fi
          done < <(git ls-files)
          while IFS= read -r f; do
            echo "::error file=$f::CRLF line endings detected - use LF"
            bad=$((bad + 1))
          done < <(grep -rlU $'\r' --include='*.zig' src core 2>/dev/null || true)
          if [ $bad -gt 0 ]; then
            echo "::error::$bad encoding violation(s) found"
            exit 1
          fi
          echo "Encoding guard: OK"
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Run runtime contract tests
        run: |
          if [ -d tests/runtime ]; then
            cd tests/runtime
            for f in test_*.py; do
              echo "::group::$f"
              python -m pytest "$f" -v --tb=short --no-header -q
              rc=$?
              echo "::endgroup::"
              if [ $rc -ne 0 ]; then
                echo "::error::$f FAILED (exit $rc)"
                exit 1
              fi
              echo "[PASS] $f"
            done
            echo ""
            echo "=== Phase T: ALL TESTS PASSED ==="
          else
            echo "::warning::tests/runtime/ directory not found - skipping Phase T"
          fi

  # ============================================================
  # Phase K: Zig per-file compile + test (skip platform-specific)
  # ============================================================
  # Step 2 cleanup: the legacy core/ directory was removed; the
  # canonical runtime lives in src/. Compile every src/ file that is
  # host-compatible and skip the Windows-specific ones (Npcap / Win32).
  # ============================================================
  phase-k-zig-logic:
    name: Phase K - Zig Logic Layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.13.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Run per-file tests (Phase K)
        run: |
          if [ ! -d src ]; then
            echo "::error::src/ directory not found"
            exit 1
          fi

          # Windows-specific files that cannot compile on Linux Host
          # (Npcap / Win32 APIs), plus the aggregate entrypoints that
          # link the full runtime.
          SKIP_PATTERNS="src/main.zig src/all_tests.zig src/fuzz_entry.zig src/capture/npcap_adapter.zig src/tests/capture/npcap_adapter.zig src/windows/ src/tests/windows/"

          pass_count=0
          fail_count=0
          skip_count=0

          while IFS= read -r f; do
            fname="$f"

            # Check skip list
            skip=false
            for s in $SKIP_PATTERNS; do
              case "$fname" in
                $s*)
                  skip=true
                  break
                  ;;
              esac
            done

            if [ "$skip" = "true" ]; then
              echo "[SKIP] $fname (Windows-specific)"
              skip_count=$((skip_count + 1))
              continue
            fi

            echo "::group::$fname"
            output=$(zig test "$f" -lc 2>&1)
            rc=$?
            echo "$output" | tail -5
            echo "::endgroup::"

            if [ $rc -eq 0 ]; then
              echo "[PASS] $fname"
              pass_count=$((pass_count + 1))
            else
              echo "::error::$fname FAILED (exit $rc)"
              fail_count=$((fail_count + 1))
            fi
          done < <(find src -type f -name '*.zig' | sort)

          echo ""
          echo "============================================================"
          echo "Phase K Summary"
          echo "============================================================"
          echo "  Passed:  $pass_count"
          echo "  Failed:  $fail_count"
          echo "  Skipped: $skip_count (Windows-specific)"
          echo ""

          if [ $fail_count -gt 0 ]; then
            echo "::error::Phase K failed with $fail_count failures"
            exit 1
          fi

          echo "=== Phase K: ALL TESTS PASSED ==="

  # ============================================================
  # Summary gate - both phases must pass
  # ============================================================
  host-regression-summary:
    name: Host Regression Summary
    needs: [phase-t-runtime-contract, phase-k-zig-logic]
    runs-on: ubuntu-latest
    steps:
      - name: Both phases passed
        run: |
          echo "============================================================"
          echo "G25 Host Regression - PASSED"
          echo "============================================================"
          echo "  Phase T (Python runtime contract): PASS"
          echo "  Phase K (Zig per-file compile+test): PASS"
          echo ""
          echo "Logic layer is green on Host."
          echo "See G25_host_regression_deploy.ps1 to deploy to Windows target."
