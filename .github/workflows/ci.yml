name: AEGIS NIDS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zig-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Zig Build
        run: zig build
      - name: Zig Test
        run: zig test nids_analyze.zig -lc

  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo Build
        run: cargo build --release
      - name: Cargo Test
        run: cargo test

  cpp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: sudo apt-get install -y cmake
      - name: CMake Build
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .
      - name: C++ Tests
        run: cd build && ctest --output-on-failure

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint
        run: |
          pip install flake8
          flake8 *.py --max-line-length=120 --ignore=E501,W605
      - name: E2E Tests
        run: python test_e2e.py

  contract-test:
    runs-on: ubuntu-latest
    needs: [zig-build, rust-build]
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Contract: IpcEvent size = 76
        run: zig test nids_analyze.zig -lc

  windows-build:
    runs-on: windows-latest
    needs: [zig-build, rust-build]
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Zig Build (Windows)
        run: zig build
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo Test (Windows)
        run: cargo test
