name: AEGIS CI

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.13.0"
  RUST_VERSION: "1.88.0"

jobs:
  zig-build-test:
    name: Zig Build & Test
    runs-on: windows-latest
    needs: [rust-pep-build, c-native-build]
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Npcap SDK
        shell: pwsh
        run: |
          $url = "https://npcap.com/dist/npcap-sdk-1.16.zip"
          $zip = Join-Path $env:TEMP "npcap-sdk.zip"
          $dest = Join-Path $env:LOCALAPPDATA "NpcapSDK"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:TEMP "npcap-sdk") -Force
          Copy-Item (Join-Path (Join-Path $env:TEMP "npcap-sdk") "Include") (Join-Path $dest "Include") -Recurse -Force
          Copy-Item (Join-Path (Join-Path $env:TEMP "npcap-sdk") "Lib") (Join-Path $dest "Lib") -Recurse -Force
          Test-Path (Join-Path $dest "Include\npcap.h")
          Test-Path (Join-Path $dest "Lib\x64\wpcap.lib")
      - name: Download PEP artifact
        uses: actions/download-artifact@v4
        with:
          name: aegis_pep_dll
          path: target/release
      - name: Download native helper artifacts
        uses: actions/download-artifact@v4
        with:
          name: native_helpers
          path: target/helpers
      - name: Build
        run: zig build
      - name: Test
        run: zig build test

  rust-pep-build:
    name: Rust PEP Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Build PEP
        run: cargo build --release
      - name: Test PEP
        run: cargo test --release
      - name: Upload PEP artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis_pep_dll
          path: |
            target/release/aegis_pep.dll
            target/release/aegis_pep.dll.lib

  c-native-build:
    name: C Native Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build --config Release
      - name: Upload native helper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native_helpers
          path: |
            build/Release/aegis_etw_helper.dll
            build/Release/aegis_etw_helper.lib
            build/Release/aegis_fim_helper.dll
            build/Release/aegis_fim_helper.lib

  python-tests:
    name: Python Control Plane Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Line-ending truth lives in .gitattributes (`* text eol=lf`). CI must
      # verify the checkout, never mutate it — a job that rewrites tracked
      # files can hide drift instead of reporting it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: pip install -r requirements.txt
      - name: Build Cython extensions
        run: |
          cd brain/cython
          python setup.py build_ext --inplace
      # Build provenance must be committed, not regenerated in CI. If the
      # recorded digests drift, the build-manifest verify gate below FAILS.
      - name: Verify build manifest provenance (drift gate)
        run: python tools/release_engineering.py --verify
      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/test_e2e.py

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0

  # CANONICAL Go owner: nose/ produces Canonical Events and is on the golden path.
  go-nose-build-test:
    name: Go Nose Build & Test (CANONICAL acquisition)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build nose
        run: |
          cd nose
          go build ./...
      - name: Test nose
        run: |
          cd nose
          go test ./...

  # SUPPORT: optional operator alert sidecar (REST :9200). It reads NDJSON
  # logs and produces no Canonical Event, so it is NOT part of the runtime path.
  go-aggregator-build-test:
    name: Go Aggregator Build & Test (SUPPORT sidecar)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build aggregator
        run: |
          cd go/aggregator
          go build ./...
      - name: Test aggregator
        run: |
          cd go/aggregator
          go test ./...

  ts-policy-build:
    name: TypeScript Policy Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd ts_policy && npm ci
      - name: Typecheck
        run: cd ts_policy && npm run typecheck
      - name: Run TS policy tests
        run: cd ts_policy && npm run test:all

  # REQUIRED FINAL GATE. `if: always()` guarantees this job is never skipped
  # when an upstream job fails; the results check below treats
  # failure / skipped / cancelled as FAIL for every required project, so a
  # skipped required job can never be mistaken for a neutral outcome.
  ci-matrix:
    name: Cross-language CI Matrix (required missing/failed = FAIL)
    runs-on: ubuntu-latest
    needs: [zig-build-test, rust-pep-build, c-native-build,
            python-tests, go-nose-build-test,
            ts-policy-build, security-scan]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check CI matrix coverage semantics
        run: python tools/ci_coverage.py
      - name: Evaluate required job results
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python tools/ci_coverage.py --needs-json "$NEEDS_JSON"

  package-release:
    name: Package Release
    needs: [zig-build-test, rust-pep-build, c-native-build,
            python-tests, go-nose-build-test]
    runs-on: windows-latest
    # `success()` is required: without it a job whose `needs` failed would
    # still run because the `if` expression would override the default gate.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && success() }}
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        run: python tools/installer.py --package --output aegis_setup.exe
      - name: Generate SBOM
        run: python tools/release_engineering.py --sbom
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aegis_setup.exe
            build_manifest.json
            sbom.spdx.json
