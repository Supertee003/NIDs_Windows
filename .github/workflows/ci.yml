name: AEGIS CI

on:
  push:
    # `codex/**` is the delivery branch: without it the only branch that ever
    # carries shippable work never ran CI, so "green CI" was a claim about
    # main, not about the commit being released.
    branches: [main, develop, release/*, "codex/**", "fix/**"]
  pull_request:
    branches: [main, develop, "codex/**"]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.13.0"
  RUST_VERSION: "1.88.0"

jobs:
  zig-build-test:
    name: Zig Build & Test
    runs-on: windows-latest
    needs: [rust-pep-build, c-native-build]
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Npcap SDK
        shell: pwsh
        run: |
          $url = "https://npcap.com/dist/npcap-sdk-1.16.zip"
          $zip = Join-Path $env:TEMP "npcap-sdk.zip"
          $dest = Join-Path $env:LOCALAPPDATA "NpcapSDK"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:TEMP "npcap-sdk") -Force
          Copy-Item (Join-Path (Join-Path $env:TEMP "npcap-sdk") "Include") (Join-Path $dest "Include") -Recurse -Force
          Copy-Item (Join-Path (Join-Path $env:TEMP "npcap-sdk") "Lib") (Join-Path $dest "Lib") -Recurse -Force
          Test-Path (Join-Path $dest "Include\npcap.h")
          Test-Path (Join-Path $dest "Lib\x64\wpcap.lib")
      - name: Download PEP artifact
        uses: actions/download-artifact@v4
        with:
          name: aegis_pep_dll
          path: target/release
      - name: Download native helper artifacts
        uses: actions/download-artifact@v4
        with:
          name: native_helpers
          path: target/helpers
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Upload runtime executable
        uses: actions/upload-artifact@v4
        with:
          name: runtime_exe
          path: zig-out/bin/aegis_nids.exe
          if-no-files-found: error

  rust-pep-build:
    name: Rust PEP Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Build PEP
        run: cargo build --release
      - name: Test PEP
        run: cargo test --release
      - name: Upload PEP artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis_pep_dll
          path: |
            target/release/aegis_pep.dll
            target/release/aegis_pep.dll.lib

  c-native-build:
    name: C Native Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build --config Release
      # Keep every uploaded path under build/Release so upload-artifact's
      # least-common-ancestor is build/Release. The Zig job downloads this
      # artifact into target/helpers and build.zig requires the .lib files at
      # the root of that directory (target/helpers/aegis_fim_helper.lib).
      # Mixing dist/* here would nest them as build/Release/* and dist/* and
      # break the canonical Zig link (observed on 4f914ad).
      - name: Upload native helper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native_helpers
          path: |
            build/Release/aegis_etw_helper.dll
            build/Release/aegis_etw_helper.lib
            build/Release/aegis_fim_helper.dll
            build/Release/aegis_fim_helper.lib
            build/Release/aegis_wfp_user.dll
            build/Release/aegis_wfp_user.lib
          if-no-files-found: error

  shield-build:
    name: Rust Shield Build & Test (required screening support)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build shield screening DLL
        run: cargo build --release --manifest-path shield/Cargo.toml
      - name: Test shield
        run: cargo test --release --manifest-path shield/Cargo.toml

  # CI-GAPS: operator-side Rust tools had no build gate at all. SUPPORT
  # classification: reported on every run, never gates canonical health.
  mouth-build-test:
    name: Mouth Build & Test (SUPPORT operator monitor)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mouth
      - name: Test mouth
        run: cargo test --manifest-path mouth/Cargo.toml
      - name: Build mouth (release)
        run: cargo build --release --manifest-path mouth/Cargo.toml

  dashboard-build-test:
    name: Dashboard Build & Test (SUPPORT egui console)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aegis_dashboard
      - name: Test dashboard
        run: cargo test --manifest-path aegis_dashboard/Cargo.toml
      - name: Build dashboard (release)
        run: cargo build --release --manifest-path aegis_dashboard/Cargo.toml

  python-tests:
    name: Python Control Plane Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ADR-0008 provenance needs real history: on a depth-1 clone the
          # tip becomes a graft root, so `git log -1 -- <SOURCE_PATHS>` reports
          # the tip and tools/truth.py verify fails every records-only commit.
          fetch-depth: 0
      # Line-ending truth lives in .gitattributes (`* text eol=lf`). CI must
      # verify the checkout, never mutate it — a job that rewrites tracked
      # files can hide drift instead of reporting it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: pip install -r requirements.txt networkx pyvis
      - name: Build Cython extensions
        run: |
          cd brain/cython
          python setup.py build_ext --inplace
      # Build provenance must be committed, not regenerated in CI. If the
      # recorded digests drift, the build-manifest verify gate below FAILS.
      - name: Verify build manifest provenance (drift gate)
        run: python tools/release_engineering.py --verify
      # CI-GATE-107: machine-map truth stamps must carry the build source
      # commit (ADR-0008). A records-only commit does not invalidate them; a
      # source/build change or a dirty source tree fails here, same as the
      # pre-commit check.
      - name: Verify machine-map truth stamps (source-commit gate)
        run: python tools/truth.py verify
      - name: Build native helper DLLs (fallback candidate)
        # tests/tools/test_no_shadow_dll.py probes build/Release/aegis_wfp_user.dll;
        # before this step that file only existed on developer machines.
        run: |
          cmake -B build -S .
          cmake --build build --config Release
      - name: Stage native helper DLLs for packaging tests
        # tools/installer.py intentionally fails closed when zig-out/bin is
        # missing or older than build/Release. Keep the test input contract
        # explicit instead of weakening the packaging guard.
        run: python tools/stage_helpers.py --stage
      - name: Run tests
        # host_live tests need the running control daemon/brain and are
        # exercised on the operator host (E5), not on a bare hosted runner.
        run: python -m pytest tests/ -v --ignore=tests/test_e2e.py -m "not host_live"

  # CI-GAPS (2026-10-19): the Tier-2 brain suite (brain/test_*.py) ran
  # nowhere in CI -- pytest's target was tests/ only, so a broken brain
  # module could pass every gate. Brain is CANONICAL (Tier-2 analytics).
  brain-tests:
    name: Brain Tests (Tier-2 analytics, CANONICAL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run brain suite
        run: python -m pytest brain/ -q

  # CI-GAPS: the accelerator the production host ships (brain/aegis_brain_cython
  # -> fast_scan.cp3xx-win_amd64.pyd) was never built or tested in CI; only the
  # pure-Python fallback ran, so a rotted .pyx (the BRAIN-FASTPATH-FIX class)
  # could not be caught before deploy.
  cython-build-test:
    name: Cython Accelerator Build & Test (Tier-2 fast path)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build the accelerator
        run: |
          cd brain/aegis_brain_cython
          python setup.py build_ext --inplace
      - name: Accelerator unit suite (compiled module present)
        run: python -m pytest brain/aegis_brain_cython/test_fast_scan.py -q
      - name: Case-2 pre-filter pin (accelerated configuration)
        run: python -m pytest tests/brain/test_cython_prefilter.py -q

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        # CI-GATE-107: pinned (never @master — a moving supply-chain ref).
        # Non-blocking by decision (exit-code 0): failing the pipeline on
        # upstream CVEs without a triage SLA would brick every PR. Findings
        # are human-triaged; flipping to exit-code 1 needs that SLA first.
        # CI-GAPS review (2026-10-19): decision re-checked and kept — no
        # triage SLA exists yet; findings stay advisory. Revisit with the SLA.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0

  # CANONICAL Go owner: nose/ produces Canonical Events and is on the golden path.
  go-nose-build-test:
    name: Go Nose Build & Test (CANONICAL acquisition)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build nose
        run: |
          cd nose
          go build ./...
          go build -o aegis-nose.exe .
      - name: Test nose
        run: |
          cd nose
          go test ./...
      - name: Upload nose artifact
        uses: actions/upload-artifact@v4
        with:
          name: nose_exe
          path: nose/aegis-nose.exe
          if-no-files-found: error

  # SUPPORT: optional operator alert sidecar (REST :9200). It reads NDJSON
  # logs and produces no Canonical Event, so it is NOT part of the runtime path.
  go-aggregator-build-test:
    name: Go Aggregator Build & Test (SUPPORT sidecar)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build aggregator
        run: |
          cd go/aggregator
          go build ./...
      - name: Test aggregator
        run: |
          cd go/aggregator
          go test ./...

  ts-policy-build:
    name: TypeScript Policy Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd ts_policy && npm ci
      - name: Typecheck
        run: cd ts_policy && npm run typecheck
      - name: Run TS policy tests
        run: cd ts_policy && npm run test:all

  # Canonical WDK compile of both kernel telemetry drivers. windows-2022 is
  # the only hosted image that still ships the standalone WDK headers + km
  # libs (GitHub removed them from windows-2025 by design, issue #14263).
  # Uses the authoritative build_truth scripts and fails closed when either
  # canonical build\x64 output is missing or empty - no legacy .bat escape.
  drivers-wdk-build:
    name: Kernel Drivers Build (WDK)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build WFP callout driver
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\wdk_build_production.ps1
      - name: Build minifilter driver
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\wdk_build_minifilter.ps1
      - name: Verify canonical WDK outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            "build\x64\wfp\aegis_wfp.sys",
            "build\x64\minifilter\aegis_minifilter.sys"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "missing canonical driver output: $f" }
            $item = Get-Item $f
            if ($item.Length -le 0) { throw "empty canonical driver output: $f" }
            Write-Host "OK $f ($($item.Length) bytes)"
          }
      - name: Upload kernel driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel_drivers
          path: |
            build/x64/wfp/aegis_wfp.sys
            build/x64/minifilter/aegis_minifilter.sys
          if-no-files-found: error

  # REQUIRED FINAL GATE. `if: always()` guarantees this job is never skipped
  # when an upstream job fails; the results check below treats
  # failure / skipped / cancelled as FAIL for every required project, so a
  # skipped required job can never be mistaken for a neutral outcome.
  ci-matrix:
    name: Cross-language CI Matrix (required missing/failed = FAIL)
    runs-on: ubuntu-latest
    needs: [zig-build-test, rust-pep-build, shield-build, c-native-build,
            python-tests, go-nose-build-test,
            brain-tests, cython-build-test,
            ts-policy-build, security-scan]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check CI matrix coverage semantics
        run: python tools/ci_coverage.py
      - name: Evaluate required job results
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python tools/ci_coverage.py --needs-json "$NEEDS_JSON"

  package-release:
    name: Package Release
    needs: [zig-build-test, rust-pep-build, c-native-build,
            python-tests, go-nose-build-test, drivers-wdk-build]
    runs-on: windows-latest
    # Build + SBOM verification runs on every push so this check is never
    # grey. Publishing stays tag-only through the Release step's own guard:
    # no branch push can create a GitHub Release or publish an installer.
    # `success()` preserves the default `needs` gate.
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # tools/installer.py imports Ed25519 from `cryptography`, which is in
      # requirements.txt. Without this the packaging job fails on a clean
      # runner even though every other Python job installs the same file.
      - run: pip install -r requirements.txt
      - name: Download build artifacts
        uses: actions/download-artifact@v4
      - name: Build native bridge (dist/aegis_ipc.dll)
        run: |
          cd bridge
          cmake -B build
          cmake --build build --config Release
      - name: Stage canonical runtime layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Need([string]$p) {
            if (-not (Test-Path $p)) { throw "missing build artifact: $p" }
          }
          Need "runtime_exe/aegis_nids.exe"
          Need "aegis_pep_dll/aegis_pep.dll"
          Need "nose_exe/aegis-nose.exe"
          # native_helpers is uploaded with build/Release as the common root,
          # so download-artifact places each file directly in native_helpers/.
          Need "native_helpers/aegis_wfp_user.dll"
          Need "native_helpers/aegis_etw_helper.dll"
          Need "native_helpers/aegis_fim_helper.dll"
          Need "dist/aegis_ipc.dll"
          $wfp = Get-ChildItem -Recurse -File -Filter "aegis_wfp.sys" "kernel_drivers" |
                 Select-Object -First 1
          $mf = Get-ChildItem -Recurse -File -Filter "aegis_minifilter.sys" "kernel_drivers" |
                Select-Object -First 1
          if (-not $wfp) { throw "missing aegis_wfp.sys artifact" }
          if (-not $mf) { throw "missing aegis_minifilter.sys artifact" }
          $dirs = @(
            "zig-out/bin", "target/release", "build/Release", "nose",
            "dist", "build/x64/wfp", "build/x64/minifilter"
          )
          foreach ($d in $dirs) { New-Item -ItemType Directory -Force -Path $d | Out-Null }
          Copy-Item "runtime_exe/aegis_nids.exe" "zig-out/bin/" -Force
          Copy-Item "aegis_pep_dll/aegis_pep.dll" "target/release/" -Force
          Copy-Item "nose_exe/aegis-nose.exe" "nose/" -Force
          foreach ($f in @("aegis_wfp_user.dll", "aegis_etw_helper.dll", "aegis_fim_helper.dll")) {
            Copy-Item "native_helpers/$f" "build/Release/" -Force
            Copy-Item "native_helpers/$f" "zig-out/bin/" -Force
          }
          Copy-Item "dist/aegis_ipc.dll" "zig-out/bin/" -Force
          Copy-Item $wfp.FullName "build/x64/wfp/" -Force
          Copy-Item $mf.FullName "build/x64/minifilter/" -Force
          Write-Host "OK: canonical runtime layout staged"
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build installer
        run: python tools/installer.py --package --output aegis_setup.exe
      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "aegis_setup.exe")) { throw "installer not produced" }
          $item = Get-Item "aegis_setup.exe"
          if ($item.Length -le 0) { throw "empty installer" }
          Write-Host "OK installer: $($item.Length) bytes"
      - name: Generate SBOM
        run: python tools/release_engineering.py --sbom
      - name: Release (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aegis_setup.exe
            build_manifest.json
            sbom.spdx.json
