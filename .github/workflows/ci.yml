name: AEGIS CI

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.13.0"
  RUST_VERSION: "1.88.0"

jobs:
  zig-build-test:
    name: Zig Build & Test
    runs-on: windows-latest
    needs: [rust-pep-build, c-native-build]
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Npcap SDK
        shell: pwsh
        run: |
          $url = "https://npcap.com/dist/npcap-sdk-1.16.zip"
          $zip = Join-Path $env:TEMP "npcap-sdk.zip"
          $dest = Join-Path $env:LOCALAPPDATA "NpcapSDK"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:TEMP "npcap-sdk") -Force
          Copy-Item (Join-Path (Join-Path $env:TEMP "npcap-sdk") "Include") (Join-Path $dest "Include") -Recurse -Force
          Copy-Item (Join-Path (Join-Path $env:TEMP "npcap-sdk") "Lib") (Join-Path $dest "Lib") -Recurse -Force
          Test-Path (Join-Path $dest "Include\npcap.h")
          Test-Path (Join-Path $dest "Lib\x64\wpcap.lib")
      - name: Download PEP artifact
        uses: actions/download-artifact@v4
        with:
          name: aegis_pep_dll
          path: target/release
      - name: Download native helper artifacts
        uses: actions/download-artifact@v4
        with:
          name: native_helpers
          path: target/helpers
      - name: Build
        run: zig build
      - name: Test
        run: zig build test

  rust-pep-build:
    name: Rust PEP Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Build PEP
        run: cargo build --release
      - name: Test PEP
        run: cargo test --release
      - name: Upload PEP artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis_pep_dll
          path: |
            target/release/aegis_pep.dll
            target/release/aegis_pep.dll.lib

  c-native-build:
    name: C Native Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build --config Release
      - name: Upload native helper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native_helpers
          path: |
            build/Release/aegis_etw_helper.dll
            build/Release/aegis_etw_helper.lib
            build/Release/aegis_fim_helper.dll
            build/Release/aegis_fim_helper.lib

  python-tests:
    name: Python Control Plane Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force LF line endings (brute force)
        shell: pwsh
        run: |
          git config core.autocrlf false
          # Convert all tracked text files to LF
          $files = git ls-files
          foreach ($f in $files) {
            if (Test-Path $f -PathType Leaf) {
              $content = Get-Content $f -Raw -Encoding UTF8
              if ($content -match "`r`n") {
                $content = $content -replace "`r`n", "`n"
                Set-Content $f -Value $content -Encoding UTF8 -NoNewline
              }
            }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: pip install -r requirements.txt
      - name: Build Cython extensions
        run: |
          cd brain/cython
          python setup.py build_ext --inplace
      - name: Regenerate manifest to match CI working tree
        run: python tools/release_engineering.py --manifest
      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/test_e2e.py

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0

  go-build-test:
    name: Go Build & Test (capture/aggregator)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Go modules
        run: |
          cd go/aggregator
          go build ./...
      - name: Test Go modules
        run: |
          cd go/aggregator
          go test ./...

  ts-policy-build:
    name: TypeScript Policy Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd ts_policy && npm ci
      - name: Typecheck
        run: cd ts_policy && npm run typecheck
      - name: Run TS policy tests
        run: cd ts_policy && npm run test:all

  ci-matrix:
    name: Cross-language CI Matrix (required missing = FAIL)
    runs-on: ubuntu-latest
    needs: [zig-build-test, rust-pep-build, c-native-build, python-tests,
            go-build-test, ts-policy-build, security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check CI matrix coverage semantics
        run: python tools/ci_coverage.py

  package-release:
    name: Package Release
    needs: [zig-build-test, rust-pep-build, c-native-build, python-tests]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        run: python tools/installer.py --package --output aegis_setup.exe
      - name: Generate SBOM
        run: python tools/release_engineering.py --sbom
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aegis_setup.exe
            build_manifest.json
            sbom.spdx.json
